[package]
name = "leaf-editor"
version = "0.5.0"
edition = "2021"
default-run = "leaf-editor"

[workspace]
members = ["file-core"]
resolver = "2"

[lib]
name = "leaf_editor"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
leaf-file-core = { path = "file-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
notify = "8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
