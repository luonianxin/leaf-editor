<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaf · 光标闪烁间隔试验</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#27332d;background:#f6f7f6;color-scheme:light;--paper:#fff;--border:#dde5df;--muted:#69776e;--green:#347d60;--period:2400ms}
*{box-sizing:border-box}body{margin:0;padding:40px 24px}main{max-width:1000px;margin:auto}header small{color:var(--green);letter-spacing:3px}h1{font-size:28px;margin:14px 0}p{line-height:1.8;color:var(--muted)}.controls,.editor{background:var(--paper);border:1px solid var(--border);border-radius:12px}.controls{padding:24px;margin:24px 0}.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}input[type=range]{flex:1;min-width:180px;accent-color:var(--green)}input[type=number]{width:90px;padding:9px;border:1px solid var(--border);border-radius:6px;background:var(--paper);color:inherit;font:inherit}button{font:inherit;border:1px solid var(--border);background:var(--paper);color:inherit;border-radius:7px;padding:9px 14px;cursor:pointer}button:hover,button[aria-pressed=true]{border-color:var(--green);background:#347d6014;color:var(--green)}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}.presets{margin:18px 0}.status{border-top:1px solid var(--border);padding-top:16px;font-size:14px;line-height:1.9}.status strong{color:var(--green)}.topbar{border-bottom:1px solid var(--border);padding:12px 20px;font-size:13px;color:var(--muted)}.sheet{padding:28px 36px;min-height:240px;font:16px/1.9 Consolas,"Microsoft YaHei",monospace}.sheet h2{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:24px;margin:0 0 20px}.typing{display:inline-block;min-width:20px;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;caret-color:transparent;max-width:100%;vertical-align:bottom}.typing:empty:before{content:"在此输入文字";color:#85938b}.cursor{display:inline-block;height:1.25em;border-left:2px solid var(--green);vertical-align:-.24em;margin-left:2px;animation:blink var(--period) step-end infinite}.steady .cursor,.typing-active .cursor{animation:none}.reference{margin-top:20px;padding-top:16px;border-top:1px dashed var(--border);font-size:14px;color:var(--muted)}.reference .cursor{animation:none}.note{font-size:13px}.footer{margin:24px 0;font-size:14px}.dark{color-scheme:dark;--paper:#1c2420;--border:#36453c;--muted:#9aac9f;--green:#88c9aa;color:#e0e8e2;background:#17201b}@keyframes blink{0%,49.999%{opacity:1}50%,100%{opacity:0}}@media(max-width:600px){body{padding:24px 14px}.sheet{padding:24px 18px}h1{font-size:24px}}
</style>
</head>
<body>
<main>
<header><small>LEAF / CURSOR LAB</small><h1>找到舒服的光标节奏</h1><p>这里的“间隔”是每次亮 / 灭持续的时间，不是完整周期。先静看几秒，再试着输入文字。</p></header>
<section class="controls" aria-label="光标设置">
<div class="row"><label for="interval"><strong>亮 / 灭间隔</strong></label><input id="interval" type="range" min="0.2" max="3" step="0.1" value="1.2"><label><input id="seconds" aria-label="间隔秒数" type="number" min="0.2" max="3" step="0.1" value="1.2"> 秒</label></div>
<div class="row presets" aria-label="常用间隔"><button data-value="0.6">0.6 秒</button><button data-value="0.7">0.7 秒 · 上一版</button><button data-value="1.2">1.2 秒 · 当前版</button><button data-value="1.5">1.5 秒</button><button data-value="2">2 秒</button><button data-value="3">3 秒</button></div>
<div class="row"><button id="steady" aria-pressed="false">常亮：关闭</button><button id="restart">重新开始观察</button><button id="theme" aria-pressed="false">切换深色背景</button></div>
<div class="status" id="status" aria-live="polite"></div>
</section>
<section class="editor" aria-label="编辑器光标效果预览">
<div class="topbar">节奏试验.md　／　模拟效果，不保存任何输入</div>
<div class="sheet" id="sheet"><h2>让文字成为思考的延伸</h2><div><span class="typing" id="typing" contenteditable="true" role="textbox" aria-label="试着输入文字" spellcheck="false">今天，给自己一点安静的书写时间。</span><span class="cursor" aria-hidden="true"></span></div><div class="reference">常亮对照：专注于内容本身<span class="cursor" aria-hidden="true"></span></div></div>
</section>
<p class="note">输入时模拟光标保持可见，停止输入后按所选间隔闪烁。此处光标固定在文字末尾，仅用于观察节奏，不模拟完整编辑器的光标移动。为便于实验，此页面允许主动观察闪烁，不跟随系统“减少动态效果”；可随时切换常亮。</p>
<div class="footer" id="choice"></div>
</main>
<script>
const slider=document.querySelector('#interval'),number=document.querySelector('#seconds'),sheet=document.querySelector('#sheet'),status=document.querySelector('#status'),choice=document.querySelector('#choice'),steady=document.querySelector('#steady'),cursor=sheet.querySelector('.cursor');
let interval=1.2,isSteady=false,inputTimer;
function restart(){cursor.style.animation='none';void cursor.offsetWidth;cursor.style.animation='';}
function update(value){const n=Number(value);if(!Number.isFinite(n))return;interval=Math.min(3,Math.max(.2,Math.round(n*10)/10));slider.value=number.value=interval;document.documentElement.style.setProperty('--period',`${interval*2000}ms`);sheet.classList.toggle('steady',isSteady);steady.setAttribute('aria-pressed',String(isSteady));steady.textContent=`常亮：${isSteady?'开启':'关闭'}`;status.innerHTML=isSteady?'当前：<strong>常亮，不闪烁</strong>':`显示 <strong>${interval.toFixed(1)} 秒</strong> → 隐藏 <strong>${interval.toFixed(1)} 秒</strong> → 重复　｜　完整周期 <strong>${(interval*2).toFixed(1)} 秒</strong>`;choice.textContent=isSteady?'选好后告诉我：「光标常亮，不闪烁」。':`选好后告诉我：「亮 / 灭间隔 ${interval.toFixed(1)} 秒（完整周期 ${(interval*2).toFixed(1)} 秒）」。`;document.querySelectorAll('[data-value]').forEach(b=>b.setAttribute('aria-pressed',String(!isSteady&&Number(b.dataset.value)===interval)));restart();}
slider.addEventListener('input',()=>update(slider.value));number.addEventListener('change',()=>update(number.value));document.querySelectorAll('[data-value]').forEach(b=>b.addEventListener('click',()=>{isSteady=false;update(b.dataset.value)}));steady.addEventListener('click',()=>{isSteady=!isSteady;update(interval)});document.querySelector('#restart').addEventListener('click',restart);document.querySelector('#theme').addEventListener('click',e=>{const dark=document.documentElement.classList.toggle('dark');e.currentTarget.setAttribute('aria-pressed',String(dark));e.currentTarget.textContent=dark?'切换浅色背景':'切换深色背景'});document.querySelector('#typing').addEventListener('input',()=>{clearTimeout(inputTimer);sheet.classList.add('typing-active');inputTimer=setTimeout(()=>{sheet.classList.remove('typing-active');restart()},interval*1000)});update(interval);
</script>
</body>
</html>
