<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940">
<title>Leaf 工具栏图标草图：三种方案</title>
<desc>三套链接、有序列表、无序列表和图片图标，包含放大细节和实际尺寸工具栏。仅设计草图，不修改编辑器。</desc>
<defs>
<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#27332d}.muted{fill:#738078}.label{font-size:13px}.icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:#34463b}.line{stroke:#e1e6e2}.small{font-size:12px}</style>
<g id="a-link" class="icon"><path d="M9 14l6-6M8 11l-2 2a3.5 3.5 0 005 5l3-3M14 11l2-2a3.5 3.5 0 00-5-5L8 7"/></g>
<g id="a-ol" class="icon"><path d="M9 5h11M9 12h11M9 19h11M3 4l1-1v4M3 7h2M3 11c0-2 3-2 3 0 0 1-3 2-3 3h3M3 17h2l-1 2c3-1 3 3-1 2"/></g>
<g id="a-ul" class="icon"><path d="M9 5h11M9 12h11M9 19h11"/><g fill="currentColor" stroke="none"><circle cx="4" cy="5" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="19" r="1.4"/></g></g>
<g id="a-image" class="icon"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="M3 17l6-6 4 4 3-3 5 5"/></g>
<g id="b-link" class="icon" style="stroke-width:1.8"><rect x="2" y="8" width="12" height="8" rx="4"/><rect x="10" y="8" width="12" height="8" rx="4"/></g>
<g id="b-ol" class="icon" style="stroke-width:1.8"><path d="M3 5l2-1v6M3 10h4M3 16c0-3 4-3 4-1 0 2-4 3-4 5h4M11 6h10M11 10h6M11 16h10M11 20h6"/></g>
<g id="b-ul" class="icon" style="stroke-width:1.8"><circle cx="4" cy="8" r="2"/><circle cx="4" cy="18" r="2"/><path d="M11 6h10M11 10h6M11 16h10M11 20h6"/></g>
<g id="b-image" class="icon" style="stroke-width:1.8"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="16" cy="9" r="1.5"/><path d="M4 17l5-6 7 9M13 16l3-3 5 5"/></g>
<g id="c-link" class="icon" style="stroke-width:2.7"><path d="M8 14l-1 1a3 3 0 004 4l4-4a3 3 0 000-4M16 10l1-1a3 3 0 00-4-4l-4 4a3 3 0 000 4M9 15l6-6"/></g>
<g id="c-ol" class="icon" style="stroke-width:2"><path d="M3 5l2-1v5M3 9h4M3 16c0-3 4-3 4-1 0 2-4 3-4 5h4"/><path d="M11 6h10M11 17h10" style="stroke-width:3"/></g>
<g id="c-ul" fill="#34463b"><rect x="2" y="4" width="5" height="5" rx="1"/><rect x="2" y="15" width="5" height="5" rx="1"/><rect x="11" y="5" width="11" height="3" rx="1"/><rect x="11" y="16" width="11" height="3" rx="1"/></g>
<g id="c-image"><rect x="2" y="3" width="20" height="18" rx="3" fill="#34463b"/><circle cx="16" cy="8" r="2" fill="#fff"/><path d="M4 18l6-8 5 6 3-3 3 5z" fill="#fff"/></g>
<g id="shell"><rect width="1104" height="210" rx="14" fill="white" stroke="#e1e6e2"/><path d="M655 24v162" class="line"/><rect x="686" y="53" width="390" height="42" rx="6" fill="#f6f7f6"/><text x="700" y="79" font-size="14" font-weight="600">B</text><text x="733" y="79" font-size="14" font-style="italic">I</text><text x="762" y="79" font-size="13">H₁</text><path d="M798 63v22" class="line"/><text x="690" y="133" font-size="15">让文字成为思考的延伸</text><path d="M872 118v19" stroke="#347d60" stroke-width="1.5"/><text x="690" y="165" class="small muted">实际尺寸 18 px · 32 px 点击区域</text><text x="690" y="188" class="small muted">工具栏上下文示意，不改变现有布局</text></g>
</defs>
<rect width="1200" height="940" fill="#f6f7f6"/>
<text x="48" y="49" font-size="13" fill="#347d60" letter-spacing="3">LEAF / DESIGN STUDY</text>
<text x="48" y="90" font-size="30" font-weight="600">更清晰的工具，更安静的书写。</text>
<text x="48" y="119" font-size="14" class="muted">四个图标 × 三种方向 · 左侧放大细节 / 右侧实际尺寸 · 仅草图，尚未应用</text>
<g transform="translate(48 146)"><use href="#shell"/><text x="24" y="35" font-size="19" font-weight="600">A / 经典细线</text><text x="190" y="35" font-size="12" fill="#347d60">推荐 · 与当前界面最协调</text><text x="24" y="63" class="label muted">斜向链环 / 三行数字与圆点 / 标准山景框</text><use href="#a-link" transform="translate(58 84) scale(2.25)"/><use href="#a-ol" transform="translate(207 84) scale(2.25)"/><use href="#a-ul" transform="translate(356 84) scale(2.25)"/><use href="#a-image" transform="translate(505 84) scale(2.25)"/><text x="72" y="164" class="label">链接</text><text x="208" y="164" class="label">有序列表</text><text x="357" y="164" class="label">无序列表</text><text x="519" y="164" class="label">图片</text><text x="24" y="191" class="small muted">1.6 px 描边 · 细节完整 · 熟悉、轻盈、不抢正文</text><use href="#a-link" transform="translate(812 65) scale(.75)"/><use href="#a-ol" transform="translate(849 65) scale(.75)"/><use href="#a-ul" transform="translate(886 65) scale(.75)"/><use href="#a-image" transform="translate(923 65) scale(.75)"/></g>
<g transform="translate(48 372)"><use href="#shell"/><text x="24" y="35" font-size="19" font-weight="600">B / 圆润双线</text><text x="24" y="63" class="label muted">横向双环 / 两组段落与空心圆 / 圆角照片</text><use href="#b-link" transform="translate(58 84) scale(2.25)"/><use href="#b-ol" transform="translate(207 84) scale(2.25)"/><use href="#b-ul" transform="translate(356 84) scale(2.25)"/><use href="#b-image" transform="translate(505 84) scale(2.25)"/><text x="72" y="164" class="label">链接</text><text x="208" y="164" class="label">有序列表</text><text x="357" y="164" class="label">无序列表</text><text x="519" y="164" class="label">图片</text><text x="24" y="191" class="small muted">1.8 px 描边 · 更大留白 · 柔和、亲近、偏写作工具</text><use href="#b-link" transform="translate(812 65) scale(.75)"/><use href="#b-ol" transform="translate(849 65) scale(.75)"/><use href="#b-ul" transform="translate(886 65) scale(.75)"/><use href="#b-image" transform="translate(923 65) scale(.75)"/></g>
<g transform="translate(48 598)"><use href="#shell"/><text x="24" y="35" font-size="19" font-weight="600">C / 紧凑实心</text><text x="24" y="63" class="label muted">粗链环 / 两行粗线与方点 / 反白山景</text><use href="#c-link" transform="translate(58 84) scale(2.25)"/><use href="#c-ol" transform="translate(207 84) scale(2.25)"/><use href="#c-ul" transform="translate(356 84) scale(2.25)"/><use href="#c-image" transform="translate(505 84) scale(2.25)"/><text x="72" y="164" class="label">链接</text><text x="208" y="164" class="label">有序列表</text><text x="357" y="164" class="label">无序列表</text><text x="519" y="164" class="label">图片</text><text x="24" y="191" class="small muted">2–3 px 粗线 / 实心 · 小尺寸更醒目 · 视觉重量较高</text><use href="#c-link" transform="translate(812 65) scale(.75)"/><use href="#c-ol" transform="translate(849 65) scale(.75)"/><use href="#c-ul" transform="translate(886 65) scale(.75)"/><use href="#c-image" transform="translate(923 65) scale(.75)"/></g>
<text x="48" y="852" font-size="17" font-weight="600">光标建议 / 三套方案通用</text>
<text x="48" y="882" font-size="14">慢闪：完整周期 1.4 秒（显示 700 ms / 隐藏 700 ms） · 输入时保持可见 · 减少动态效果时常亮</text>
<text x="48" y="909" font-size="12" class="muted">节奏为拟议参数，尚未测量或修改当前实现。图标可混搭；选定后再做真实编辑器验证。</text>
</svg>